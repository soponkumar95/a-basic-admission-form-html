<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Form</title>
    <link rel="stylesheet" href="style.css/style.css">
</head>
<body>
    <div class="div">
         <h1 class="heading">Please Fill Up Form</h1>
         <form action="#">
            <label for="firstname">First name :</label> 
            <input type="text" id="firstname">
            <br>
            <label for="lastname">Last Name :</label>
            <input type="text" id="lastname">
            <br>
            <label for="fname">Fathers Name :</label>
            <input type="fname" id="fname">
            <br>
            <label for="mname">Mothers Name :</label>
            <input type="text" id="mname">
            <br>
            <label for="sex" name="sex">Sex :</label>
            <input type="radio" id="sex" name="sex">Male
            <input type="radio" id="sex" name="sex">Female
            <br>
            <label for="bgroup">Blood Group: </label>
            <select>
                <option value="a+">A+ve</option>
                <option value="a-">A-ve</option>
                <option value="ab+">AB+ve</option>
                <option value="ab-">AB-ve</option>
                <option value="b">B+ve</option>
                <option value="b-">B-ve</option>
                <option value="o-">O+ve</option>
                <option value="o-">O-ve</option>
            </select>
         </form>
    </div>
   
</body>
</html>
